<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout after Shopify's "Studio" theme for artists: quiet grid, product cards, one sans-serif family.
   Colours stay the deep wine of the velvet the watercolours are photographed on. */
:root{
  --bg:#170509; --surface:#22090f; --ink:#F4ECE8; --muted:#B7A0A4; --line:rgba(244,236,232,.14);
  --accent:#F0A79F; --sold:#E5566B;
  --font:"Manrope","Helvetica Neue",Arial,sans-serif;
  --wide:"Unbounded","Manrope",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg);scroll-padding-top:var(--hh,64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px)}
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:20}
.skip:focus{left:8px}

/* header */
.top{position:sticky;top:0;z-index:10;background:rgba(23,5,9,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 28px;padding-block:16px}
.brand{font-weight:600;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.nav{display:flex;flex-wrap:wrap;gap:6px 26px}
.nav a{font-size:.9rem;color:var(--muted);text-decoration:none;padding-block:4px}
.nav a:hover{color:var(--ink)}
.lang{display:flex;gap:12px}
.lang button{font-size:.82rem;font-weight:500;letter-spacing:.06em;padding:4px 0;background:none;border:0;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px}

/* type */
h1,h2,h3{font-weight:500;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:clamp(1.8rem,4.4vw,2.6rem);line-height:1.12;margin-bottom:14px}
.lead{color:var(--muted);max-width:40rem;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:500;text-decoration:none;padding:14px 26px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.row{display:flex;flex-wrap:wrap;gap:10px 12px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,6vw,96px);align-items:center;padding-block:clamp(32px,6vw,88px) clamp(56px,8vw,112px)}
.hero h1{font-size:clamp(2.8rem,8.5vw,6rem);line-height:1;font-weight:500;letter-spacing:-.035em;margin:0 0 22px}
.hero .sub{font-size:.9rem;color:var(--muted);margin:0 0 18px}
.hero .lede{font-size:clamp(1.1rem,2.2vw,1.35rem);line-height:1.5;font-weight:300;max-width:26rem;margin:0 0 32px}
.feature{margin:0;justify-self:end;width:100%;max-width:480px}
.feature img{display:block;width:100%;height:auto}
.feature figcaption{font-size:.85rem;color:var(--muted);margin-top:10px}

/* sections */
.sec{padding-block:clamp(56px,8vw,112px)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 32px;margin-bottom:clamp(24px,4vw,40px)}
.sec-head>div{max-width:42rem}

/* collection tabs + filters */
.tabs{display:flex;gap:28px;margin-bottom:18px}
.tabs button{background:none;border:0;padding:0 0 6px;cursor:pointer;font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:500;color:var(--muted);border-bottom:1px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button i{font-style:normal;font-size:.6em;vertical-align:super;margin-left:4px;opacity:.7}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:clamp(24px,4vw,40px)}
.filters button{font-size:.82rem;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted)}
.filters button:hover{color:var(--ink);border-color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters button i{font-style:normal;opacity:.6;margin-left:5px}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 22px}
.card{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:zoom-in}
.card .frame{display:block;position:relative;aspect-ratio:4/5;background:var(--surface);overflow:hidden}
.card img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card.fit .frame{background:var(--bg)}
.card.fit img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.card:hover img{transform:scale(1.03)}
.card .cap{display:block;margin-top:12px}
.card .cap b{display:block;font-weight:500;font-size:.98rem;line-height:1.35}
.card .cap small{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
.card .price{display:block;font-size:.95rem;margin-top:6px}
.sold{color:var(--sold)}

/* projects */
.feat{display:grid;gap:clamp(48px,7vw,96px)}
.fp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(24px,5vw,72px);align-items:center}
.fp:nth-child(even) .fp-img{order:2}
.fp-img{display:block;padding:0;border:0;background:var(--surface);cursor:pointer;width:100%}
.fp-img img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.fp h3{font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.15;margin-bottom:8px}
.fp .meta{font-size:.88rem;color:var(--muted);margin:0 0 16px}
.fp p.txt{margin:0 0 24px;max-width:30rem}
.others{margin-top:clamp(72px,10vw,128px)}
.others h3{font-size:1.25rem;margin-bottom:24px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 22px}
.pcard{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.pcard .frame{display:block;aspect-ratio:1/1;background:var(--surface);overflow:hidden}
.pcard img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.pcard:hover img{transform:scale(1.03)}
.pcard .cap{display:block;margin-top:10px}
.pcard .cap b{display:block;font-weight:500;font-size:.95rem;line-height:1.35}
.pcard .cap small{display:block;font-size:.82rem;color:var(--muted)}

/* project page */
#pd{background:var(--bg);overflow:auto}
#pd[open]{display:block;padding:0}
.pd-in{max-width:1120px;margin:0 auto;padding:72px clamp(16px,4vw,40px) 64px}
.pd-in h3{font-size:clamp(2rem,6vw,3rem);line-height:1.1;margin:0 0 10px}
.pd-meta{font-size:.9rem;color:var(--muted);margin:0 0 4px}
.pd-text{margin:24px 0 28px}
.pd-text p{max-width:44rem;margin:0 0 1em}
.pd-links{margin:0 0 36px}
.pd-grid{columns:3 260px;column-gap:18px;margin-top:32px}
.pd-grid button{display:block;width:100%;padding:0;border:0;background:var(--surface);margin:0 0 18px;cursor:zoom-in;break-inside:avoid;text-align:left}
.pd-grid img{display:block;width:100%;height:auto}
.pd-grid small{display:block;background:var(--bg);font-size:.82rem;color:var(--muted);padding:8px 0 4px}
.pd-close{z-index:2;background:var(--bg)}

/* lightbox */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none;width:100vw;height:100dvh}
dialog::backdrop{background:#0f0306}
#lb[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:56px 16px 20px}
.lb-img{max-width:min(92vw,900px);max-height:calc(100dvh - 230px);width:auto;height:auto;object-fit:contain}
.lb-cap{text-align:center;max-width:38rem}
.lb-cap b{display:block;font-weight:500;font-size:1.3rem;line-height:1.3}
.lb-cap em{display:block;font-style:normal;color:var(--muted);font-size:.95rem}
.lb-cap small{display:block;font-size:.85rem;color:var(--muted);margin-top:6px}
.lb-cap .row{justify-content:center;margin-top:12px}
.lb-price{font-size:1.1rem;margin:10px 0 0}
.lb-cap .btn{padding:10px 18px;font-size:.85rem}
.lb-btn{position:fixed;background:none;border:0;width:46px;height:46px;cursor:pointer;font-size:1.5rem;line-height:1;display:grid;place-items:center;color:var(--muted)}
.lb-btn:hover{color:var(--ink)}
.lb-close{top:12px;right:12px}
.lb-prev{left:10px;top:50%;transform:translateY(-50%)}
.lb-next{right:10px;top:50%;transform:translateY(-50%)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.5fr) minmax(0,1.5fr);gap:clamp(28px,6vw,88px);align-items:start}
.portrait{margin:0;max-width:260px}
.portrait img{display:block;width:100%;height:auto;filter:grayscale(1)}
.portrait figcaption{font-size:.85rem;color:var(--muted);margin-top:14px}
.statement p{font-size:clamp(1.02rem,1.6vw,1.15rem);margin:0 0 .9em;max-width:40rem}
.statement p:first-of-type{font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.3;font-weight:400;letter-spacing:-.01em}

/* cv */
.cv-wrap{margin-top:clamp(56px,8vw,104px)}
.cv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(36px,6vw,72px) clamp(28px,6vw,80px)}
.cv-block h3{font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cv{list-style:none;margin:0;padding:0}
.cv li{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:14px;padding:10px 0}
.cv .yr{font-size:.9rem;color:var(--muted)}
.cv .tx{font-size:.95rem;line-height:1.5}
.cv .tx b{display:block;font-weight:500}
.cv .tx small{display:block;font-size:.88rem;color:var(--muted);line-height:1.45}

/* buy */
.buy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(24px,4vw,48px)}
.buy article{background:var(--surface);padding:clamp(22px,3vw,36px)}
.buy h3{font-size:1.3rem;margin-bottom:4px}
.buy .price{font-size:1.05rem;margin:0 0 18px;color:var(--accent)}
.buy dl{margin:0 0 24px}
.buy dl div{padding:9px 0}
.buy dt{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.buy dd{margin:2px 0 0}
.note{margin:clamp(20px,3vw,32px) 0 0;color:var(--muted);font-size:.92rem}

/* contact */
.contact h2{font-size:clamp(1.9rem,5vw,3.2rem);max-width:18em;font-weight:400}
.contact p{margin:0 0 28px;max-width:30rem;color:var(--muted)}
footer .wrap{padding-block:28px 40px;font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}


/* wide, thin display type (in the spirit of the new Jaguar identity) */
.brand{font-family:var(--wide);font-weight:300;letter-spacing:.14em}
h1,h2,h3{font-family:var(--wide);font-weight:200;letter-spacing:.01em}
.hero h1{font-weight:200;letter-spacing:.02em;font-size:clamp(2.3rem,6.6vw,4.8rem);line-height:1.08}
h2{font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.2}
.fp h3{font-size:clamp(1.3rem,2.6vw,1.8rem);line-height:1.25}
.pd-in h3{font-size:clamp(1.6rem,4.4vw,2.5rem);line-height:1.2}
.others h3{font-size:1.05rem}
.card .cap b,.pcard .cap b{font-weight:500}
.buy h3{font-size:1.1rem}
.cv-block h3{font-family:var(--font);font-weight:600;letter-spacing:.08em}
.lb-cap b{font-family:var(--wide);font-weight:200;font-size:1.15rem}
.contact h2{font-weight:200;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.25}
.tabs button{font-family:var(--wide);font-weight:300;font-size:clamp(1rem,2vw,1.2rem)}
.btn{letter-spacing:.04em}

@media (max-width:1000px){
  .grid,.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .feature{justify-self:start;max-width:400px}
  .fp{grid-template-columns:1fr}
  .fp:nth-child(even) .fp-img{order:0}
  .about{grid-template-columns:1fr}
  .portrait{max-width:200px}
  .cv-grid,.buy{grid-template-columns:1fr}
}
@media (max-width:640px){
  .top .wrap{padding-block:12px;gap:8px 16px}
  .nav{order:3;width:100%;flex-wrap:nowrap;justify-content:space-between;gap:0 8px}
  .nav a{white-space:nowrap;font-size:clamp(.72rem,3.4vw,.88rem)}
  .grid,.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 14px}
  .row .btn{flex:1 1 auto}
  .lb-prev,.lb-next{top:auto;bottom:10px;transform:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card img,.pcard img{transition:none}.card:hover img,.pcard:hover img{transform:none}}
</style>
</head>

{slug:'twenty-questions',n:12,v:0,y:2023,t:['20 запитань і 20 відповідей','20 Questions and 20 Answers'],m:['Серія графічних робіт · Папір, лайнер · Тель-Авів, Ізраїль','Series of drawings · Paper, liner · Tel Aviv, Israel'],d:null},
{slug:'ghosts',n:10,v:1,y:'2022–2023',url:'https://www.behance.net/gallery/157061763/GHOSTS',t:['Привиди','Ghosts'],m:['Відеоперформанс · Львів – Тель-Авів','Video performance · Lviv – Tel Aviv'],d:['Проєкт відображає проблему родин, розділених війною в Україні, відтворюючи спілкування подружжя на відстані.\nВідео (проєкцію) обрано основним медіумом як найкращий спосіб передати нереальність такого спілкування: спотворення звуку, затримку й деформацію зображення.\nОснова роботи — документальні файли (відео, аудіо й текст), накопичені під час перебування на резиденції. Вони фіксують дві паралельні реальності, у яких перебувають художники. Цей процес обміну новинами й емоціями в глобальному сенсі відображає українське суспільство, розділене на тих, хто виїхав під час бойових дій, і тих, хто залишився.\nОсновою стала взаємодія із «проєкцією з іншого часу», за аналогією до паперових листів, де ти під час відкриття листа/відео щоразу опинявся в минулому. Найдовша зустріч із «повідомленням» сталася через 3 місяці, після надсилання.','The project reflects the problem of families separated by the war in Ukraine, reproducing the communication of spouses at a distance.\nVideo (projection) was chosen as the main medium as the best means of conveying the unreality of such communication: sound distortion, delay and image deformation.\nThe work is based on documentary files (video, audio and text) accumulated during a residency. They record two parallel realities in which the artists find themselves. This exchange of news and emotions is, in a global sense, a reflection of Ukrainian society, divided between those who left the country during the hostilities and those who stayed.\nThe basis was interaction with a “projection from another time”, by analogy with paper letters, where each time you opened a letter/video you found yourself in the past. The longest encounter with a “message” happened 3 months after it was sent.']},

{slug:'kreminna',n:5,v:0,y:0,url:'https://www.behance.net/gallery/146515037/kremnnaukrana',t:['Кремінна/Україна','Kreminna/Ukraine'],d:null},
{slug:'psychology-of-war',n:11,v:2,y:2022,url:'https://www.behance.net/gallery/146520357/psihologja-vjni',t:['Психологія війни','Psychology of War'],d:['Благодійний мистецький пленер УКУ «На межі». Серія «Стани війни»: «Зміна реальності», «Гнів», «Депресія», «Прийняття» (полотно, вугілля, акрил).\nСерія «Стани війни» — про військові дії, які відбуваються у кожного з нас, незалежно від того, де ми перебуваємо.\n«Зміна реальності» — як мить, коли було натиснуто на спусковий гачок: те, що відбулося потім, уже неможливо порівнювати з тим, що існувало до.\n«Гнів» — це не завжди бій, це можуть бути сльози й втеча, але завжди це найпотужніша реакція, яка керує нами. Після цього завжди приходить спустошення.\n«Депресія». Дослідження стверджують, що «через півроку майже всі відчувають зменшення негативних емоцій, проте повного одужання не настає…»\n«Прийняття» — дія, яка зараз не може бути завершена, бо як можна змиритись і прийняти те, що не має кінця й щодня завдає тобі нового болю…','Charity art plein air of the Ukrainian Catholic University “On the Edge”. Series “States of War”: “Change of Reality”, “Anger”, “Depression”, “Acceptance” (canvas, charcoal, acrylic).\nThe “States of War” series is about the hostilities that take place within each of us, regardless of where we are.\n“Change of Reality” is like the moment the trigger was pulled: what happened afterwards can no longer be compared with what existed before.\n“Anger” is not always a fight; it may be tears and flight, but it is always the most powerful reaction, the one that governs us. Emptiness always follows.\n“Depression”. Studies say that “after six months almost everyone feels a decrease in negative emotions, but full recovery does not come…”\n“Acceptance” is an action that cannot be completed now, because how can one come to terms with and accept what has no end and inflicts new pain every day…']},
{slug:'watchman',n:13,v:0,y:2019,url:'https://www.behance.net/gallery/145921019/Watchman',t:['Сторожа','Watchman'],m:['Графічні роботи, перформанс · Полотно, акрил, вугілля · 75×300 см · Київ, Україна','Graphic works, performance · Canvas, acrylic, charcoal · 75×300 cm · Kyiv, Ukraine'],d:['«Образ», що не має окремих рис чи будь-якої іншої персоналізації.\nРоботи створено в пам’ять про друзів, які загинули під час Революції Гідності.','An “image” with no individual features or any other personalisation.\nThe works were created in memory of friends who died during the Revolution of Dignity.']},
{slug:'cage',n:3,v:0,y:2019,url:'https://www.behance.net/gallery/113725307/Cage',t:['Cage','Cage'],d:['Обмеження й правила: що вони означають у контексті особистої та індивідуальної свободи? Символічна клітка чи захист від «зовнішнього».\nРозміри скульптур: 75×40×330. Матеріал: дерево, металевий дріт. Луцьк, 2019.\nСвоєрідна форма протесту: з одного боку, вона дає право висловити свою точку зору, з іншого — змушує суворо дотримуватися встановлених принципів заради досягнення мети. Ваші думки й бажання обмежені зовнішньою оболонкою, яку ми створюємо самі. Зовнішні стереотипи, правила й страхи будують навколо нас каркас, у якому ми проживаємо все життя. Питання лишається: бути захищеним і жити в клітці — чи жити без захисту, але вільним.\nПроєкт передбачає створення каркасних скульптур, які стають символічною кліткою для реальних людей. Презентація має форму перформансу. Складники: перформанс, інсталяція.','Restrictions and rules: what are they in the context of personal and individual freedom? A symbolic cage, or protection from the “outside”.\nDimensions of the sculptures: 75×40×330. Material: wood, metal wire. Lutsk, 2019.\nA peculiar form of protest which, on the one hand, gives you the right to express your point of view and, on the other, forces you to adhere strictly to the set principles in order to achieve the goal. Your thoughts and desires are limited by the outer shell that we create for ourselves. External stereotypes, rules and fears build a frame around us in which we spend our whole life. The question remains: to be protected and live in a cage, or to live without protection but free.\nThe project involves creating frame sculptures that become a symbolic cage for real people. The presentation takes the form of a performance. Components: performance, installation.']},
{slug:'nyenskans',n:4,v:0,y:0,url:'https://www.behance.net/gallery/146516357/Nyenskans',t:['Nyenskans','Nyenskans'],d:['Ніеншанц (швед. Nyenskans) — шведська фортеця на злитті річок Нева й Охта, на місці якої пізніше постав Санкт-Петербург. Збудована 1611 року для утвердження шведської влади в Інгрії; 1702 року фортецю й місто Ніен захопила Росія під час Північної війни.','Nyenschantz (Nyenskans) was a Swedish fortress at the confluence of the Neva and Okhta rivers, on the site of present-day Saint Petersburg. It was built in 1611 to establish Swedish rule in Ingria; in 1702 the fortress and the town of Nyen were conquered by Russia during the Great Northern War.']},

  /* lightbox */
  function workCap(w,extra){
    var t=T[lang],k=li(),S=w.k==='pt'?PSERIES:SERIES;
    var line=[w.y,fmtSize(w.size),M[w.m][k]];
    if(w.f)line.push(t.framed);
    var h='<b>'+w.t[k]+'</b>'+(w.t[0]!==w.t[1]?'<em>'+w.t[1-k]+'</em>':'')+
      '<small>'+(extra||S[w.s][k])+'<br>'+line.join(' · ')+'</small>';
    if(w.sold)h+='<small class="sold">'+t.sold+'</small>';
    else if(w.price)h+='<p class="lb-price">'+fmtPrice(w.price)+'</p><div class="row"><a class="btn" href="'+IG+'" target="_blank" rel="noopener">'+t.askWork+'</a></div>';
    return h;
  }
  function showLb(n){
    var k=li(),w=list[n];if(!w)return;
    cur=n;
    if(w.p!=null){
      $('lbImg').src=w.src;$('lbImg').alt=w.alt;
      $('lbCap').innerHTML=w.wk?workCap(w.wk,PJ[w.p].t[k]):'<b>'+PJ[w.p].t[k]+'</b><small>'+(n+1)+' / '+list.length+'</small>';
    }else{
      $('lbImg').src=w.src;$('lbImg').alt=w.t[1];
      $('lbCap').innerHTML=workCap(w);
    }
    $('lbPrev').style.visibility=list.length>1?'visible':'hidden';
    $('lbNext').style.visibility=list.length>1?'visible':'hidden';
  }
  function openLb(n){showLb(n);var d=$('lb');if(!d.open)d.showModal();}
  function step(d){showLb((cur+d+list.length)%list.length);}

  /* projects */
  function pCount(n){
    if(lang!=='uk')return n+(n===1?' image':' images');
    var a=n%10,b=n%100;
    return n+' '+(((a>=2&&a<=4&&(b<10||b>=20))||(a===1&&b!==11))?'зображення':'зображень');
  }
  function pItems(p){var a=[],i;
    if(p.ps)P.forEach(function(w){if(w.s===p.ps)a.push({src:w.src,w:w});});
    for(i=1;i<=p.n;i++)a.push({src:'projects/'+p.slug+'-'+(i<10?'0':'')+i+'.jpg'});
    (p.extra||[]).forEach(function(s){a.push({src:s});});
    if(p.ws)W.forEach(function(w){if(w.s===p.ws)a.push({src:w.src,w:w});});
    return a;}
  function pCover(p){return p.cover||pItems(p)[0].src;}
  function pMeta(p){var m=[];if(p.y)m.push(p.y);m.push(pCount(pItems(p).length));return m.join(' · ');}
  function renderProjects(){
    var t=T[lang],k=li(),f='',o='';
    PJ.forEach(function(p,i){
      if(p.main){
        f+='<article class="fp"><button type="button" class="fp-img" data-p="'+i+'"><img loading="lazy" src="'+pCover(p)+'" alt="'+p.t[1]+'"></button>'+
          '<div><h3>'+p.t[k]+'</h3><p class="meta">'+pMeta(p)+'</p>'+(p.lead?'<p class="txt">'+p.lead[k]+'</p>':'')+
          '<button type="button" class="btn ghost" data-p="'+i+'">'+t.pOpen+'</button></div></article>';
      }else{
        o+='<button type="button" class="pcard" data-p="'+i+'"><span class="frame"><img loading="lazy" src="'+pCover(p)+'" alt="'+p.t[1]+'"></span>'+
          '<span class="cap"><b>'+p.t[k]+'</b><small>'+pMeta(p)+'</small></span></button>';
      }
    });
    $('featGrid').innerHTML=f;$('projGrid').innerHTML=o;
  }
  function openProject(i){
    var t=T[lang],k=li(),p=PJ[i];
    pcur=i;
    var html='<button type="button" class="lb-btn lb-close pd-close" id="pdClose" aria-label="'+t.close+'">×</button><div class="pd-in"><h3>'+p.t[k]+'</h3><p class="pd-meta">'+pMeta(p)+'</p>'+(p.m?'<p class="pd-meta">'+p.m[k]+'</p>':'');
    if(p.d)html+='<div class="pd-text">'+p.d[k].split('\n').map(function(s){return '<p>'+s+'</p>';}).join('')+'</div>';
    if(p.url)html+='<div class="pd-links"><a class="btn ghost" href="'+p.url+'" target="_blank" rel="noopener">'+(p.v?t.pVideo:t.pBehance)+'</a></div>';
    html+='<div class="pd-grid">'+pItems(p).map(function(x,j){
      var cap=x.w&&x.w.k==='pt'?'<small>'+x.w.t[k]+' · '+x.w.y+' · '+fmtSize(x.w.size)+'</small>':'';
      return '<button type="button" data-j="'+j+'"><img loading="lazy" src="'+x.src+'" alt="'+p.t[1]+' — '+(x.w?x.w.t[1]:(j+1))+'">'+cap+'</button>';
    }).join('')+'</div></div>';
    $('pd').innerHTML=html;
    if(!$('pd').open)$('pd').showModal();
    $('pd').scrollTop=0;
  }

  function render(){
    var t=T[lang],i;
    document.documentElement.lang=lang;
    var nodes=document.querySelectorAll('[data-i]');
    for(i=0;i<nodes.length;i++){var v=t[nodes[i].getAttribute('data-i')];if(v!=null)nodes[i].innerHTML=v;}
    $('featCap').innerHTML=t.featCap;
    $('statement').innerHTML=t.statement.map(function(p){return '<p>'+p+'</p>';}).join('');
    $('cvEdu').innerHTML=cvRows(CV.edu);
    $('cvAwards').innerHTML=cvRows(CV.awards);
    $('cvGroup').innerHTML=cvRows(CV.group);
    $('cvSolo').innerHTML=cvRows(CV.solo);
    $('cvCur').innerHTML=cvRows(CV.cur);
    function dl(a){return a.map(function(f){return '<div><dt>'+f[0]+'</dt><dd>'+f[1]+'</dd></div>';}).join('');}
    $('wcFacts').innerHTML=dl(t.wcFacts);$('ptFacts').innerHTML=dl(t.ptFacts);
    $('lbClose').setAttribute('aria-label',t.close);$('lbPrev').setAttribute('aria-label',t.prev);$('lbNext').setAttribute('aria-label',t.next);
    $('lang-uk').setAttribute('aria-pressed',String(lang==='uk'));
    $('lang-en').setAttribute('aria-pressed',String(lang==='en'));
    renderTabs();renderFilters();renderGallery();renderProjects();
    if($('pd').open){var st=$('pd').scrollTop;openProject(pcur);$('pd').scrollTop=st;}
    if($('lb').open)showLb(Math.min(cur,list.length-1));
  }

  document.querySelector('.lang').addEventListener('click',function(e){
    var b=e.target.closest('button[data-lang]');if(!b)return;
    lang=b.getAttribute('data-lang');
    try{localStorage.setItem('vr-lang',lang);}catch(err){}
    render();
  });
  $('tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-k]');if(!b)return;
    kind=b.getAttribute('data-k');filter='all';renderTabs();renderFilters();renderGallery();
  });
  $('filters').addEventListener('click',function(e){
    var b=e.target.closest('button[data-f]');if(!b)return;
    filter=b.getAttribute('data-f');renderFilters();renderGallery();
  });
  $('gallery').addEventListener('click',function(e){
    var b=e.target.closest('.card');if(!b)return;
    list=glist;openLb(+b.getAttribute('data-n'));
  });
  $('lbClose').addEventListener('click',function(){$('lb').close();});
  $('lbPrev').addEventListener('click',function(){step(-1);});
  $('lbNext').addEventListener('click',function(){step(1);});
  $('lb').addEventListener('click',function(e){if(e.target===this)this.close();});
  document.addEventListener('keydown',function(e){
    if(!$('lb').open)return;
    if(e.key==='ArrowLeft')step(-1);
    if(e.key==='ArrowRight')step(1);
  });
  function projClick(e){var b=e.target.closest('[data-p]');if(!b)return;openProject(+b.getAttribute('data-p'));}
  $('featGrid').addEventListener('click',projClick);
  $('projGrid').addEventListener('click',projClick);
  $('pd').addEventListener('click',function(e){
    if(e.target===this||e.target.closest('#pdClose')){this.close();return;}
    var b=e.target.closest('.pd-grid button');if(!b)return;
    var p=PJ[pcur];
    list=pItems(p).map(function(x,j){return {p:pcur,src:x.src,wk:x.w,alt:p.t[1]+' — '+(x.w?x.w.t[1]:(j+1))};});
    openLb(+b.getAttribute('data-j'));
  });
  render();

  var hdr=document.querySelector('.top');
  function syncHdr(){document.documentElement.style.setProperty('--hh',hdr.offsetHeight+'px');}
  syncHdr();
  if(window.ResizeObserver)new ResizeObserver(syncHdr).observe(hdr);
  else window.addEventListener('resize',syncHdr);
})();
</script>

</body>
</html>
